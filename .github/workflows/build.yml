name: Build EchoWP Schichtplan

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'branding/**', '.claude/**']
  workflow_dispatch:

# Minimalrechte: Bauen nur lesend, nur der Release-Job darf schreiben
permissions:
  contents: read

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Plattform-Dateien erzeugen
        run: flutter create --platforms=android --org de.echowp --project-name schichtplan .
      - run: flutter pub get
      - name: App-Symbol erzeugen
        run: dart run flutter_launcher_icons
      - name: Firebase-Zugang aus GitHub-Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 tool/make_firebase_options.py
      - name: Signierschlüssel aus GitHub-Secrets
        id: keystore
        env:
          KS_B64: ${{ secrets.SCHICHTPLAN_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.SCHICHTPLAN_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::warning::Secrets SCHICHTPLAN_KEYSTORE_B64 / SCHICHTPLAN_KEYSTORE_PASSWORD fehlen – es entsteht nur eine Test-APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > keystore/schichtplan.jks
          keytool -list -keystore keystore/schichtplan.jks -storepass "$KS_PW" -alias echowp > /dev/null || { echo "::error::Keystore oder Passwort ungültig"; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Plattform anpassen
        env:
          SCHICHTPLAN_KEYSTORE_PASSWORD: ${{ secrets.SCHICHTPLAN_KEYSTORE_PASSWORD }}
        run: python3 tool/patch_android.py
      - name: Code prüfen
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - name: Automatische Tests
        run: flutter test --reporter expanded
      - name: APK bauen
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }}
      - name: APK prüfen (Größe, Version, Signatur)
        run: |
          mkdir -p dist
          NAME=EchoWP-Schichtplan.apk
          [ "${{ steps.keystore.outputs.signed }}" = "true" ] || NAME=EchoWP-Schichtplan-Test.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$NAME"
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "== $NAME: $(du -h "dist/$NAME" | cut -f1)"
          "$AAPT/aapt2" dump badging "dist/$NAME" | grep -E "^package:|application-label:"
          echo "Zertifikat (für Firebase → Projekteinstellungen → SHA-Fingerabdrücke):"
          "$AAPT/apksigner" verify --print-certs "dist/$NAME" | grep -E "SHA-1|SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EchoWP-Schichtplan-Android
          path: dist/*.apk

  release:
    name: Download-Seite (Release)
    needs: android
    if: needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Version lesen
        id: ver
        run: |
          echo "v=$(sed -nE 's/^version: *([0-9.]+).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-build-${{ github.run_number }}
          name: EchoWP Schichtplan v${{ steps.ver.outputs.v }} (Build ${{ github.run_number }})
          make_latest: true
          body: |
            `EchoWP-Schichtplan.apk` auf dem Handy herunterladen und installieren.
            Bei der Warnung von Play Protect „Trotzdem installieren“ wählen.
          files: dist/*.apk
